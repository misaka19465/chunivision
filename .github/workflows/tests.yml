name: Tests

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Add project to PYTHONPATH
      run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

    - name: Lint with flake8
      run: |
        flake8 chunivision tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 chunivision tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format check with black
      run: |
        black --check chunivision tests

    - name: Run tests with pytest
      run: PYTHONPATH=$(pwd) pytest tests -v --tb=short

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: |
          .pytest_cache/
