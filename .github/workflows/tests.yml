name: Tests

on:
  - push
  - pull_request

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.get-commits.outputs.commits }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get commits
      id: get-commits
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          # For PR, get commits in the PR
          COMMITS=$(git log --format='"%H"' ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | jq -s -c .)
        else
          # For push, get commits in this push
          if [ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]; then
            # New branch, test only the latest commit
            COMMITS='["${{ github.sha }}"]'
          else
            COMMITS=$(git log --format='"%H"' ${{ github.event.before }}..${{ github.event.after }} | jq -s -c .)
          fi
        fi
        echo "commits=$COMMITS" >> $GITHUB_OUTPUT
        echo "Testing commits: $COMMITS"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        commit: ${{ fromJson(needs.prepare.outputs.commits) }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.commit }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Add project to PYTHONPATH
      run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

    - name: Lint with flake8
      run: |
        flake8 chunivision tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 chunivision tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format check with black
      run: |
        black --check chunivision tests

    - name: Run tests with pytest
      run: PYTHONPATH=$(pwd) pytest tests -v --tb=short --junitxml=test-results.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: test-results-${{ matrix.python-version }}-${{ matrix.commit }}
        path: test-results.xml
